<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light}</style></head><body style="margin:0">
<title>Git Visualized</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=JetBrains+Mono:wght@500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* ============ Design tokens (same language as the cheat sheet) ============
   Neutrals are pure greys; colour lives in the commit lanes, ref pills and accents.
   Dark = neon glow on near-black. Light = paper with hard ink outlines. */
:root, .t-light {
  --bg: #ececec; --bg2: #e2e2e2; --surface: #ffffff; --surface2: #f3f3f3; --code: #f0f0f0;
  --line: #cdcdcd; --outline: #151515; --dot: #c4c4c4;
  --fg: #121212; --fg2: #353535; --fg3: #585858;
  --c-orange: #b23a06; --c-cyan: #005f7c; --c-green: #0a6a34; --c-violet: #5a2ac0;
  --c-amber: #7a4800; --c-magenta: #a30e66; --c-red: #b3281a; --c-blue: #1f4fd8;
  --t-orange: rgba(178,58,6,.13); --t-cyan: rgba(0,95,124,.13); --t-green: rgba(10,106,52,.13);
  --t-violet: rgba(90,42,192,.12); --t-amber: rgba(122,72,0,.14); --t-magenta: rgba(163,14,102,.12); --t-red: rgba(179,40,26,.12);
  --hl: rgba(255, 214, 10, .55); --on-ac: #ffffff;
  --sx: 5px; --sy: 5px; --ring-w: 0px; --glow-blur: 0px; --nglow: 0px; --edge-w: 3.2px;
  --hov-x: 3px; --hov-y: 3px; --hov-glow: 0px; --tglow: 0px; --gglow: 0px;
  --glass: rgba(236,236,236,.92);
  color-scheme: light;
}
:root[data-theme="dark"], .t-dark {
  --bg: #090909; --bg2: #101010; --surface: #151515; --surface2: #1d1d1d; --code: #0c0c0c;
  --line: #2b2b2b; --outline: #3a3a3a; --dot: #1d1d1d;
  --fg: #f4f4f4; --fg2: #cbcbcb; --fg3: #9d9d9d;
  --c-orange: #ff8c5e; --c-cyan: #52e1ff; --c-green: #5ef2a0; --c-violet: #bfa8ff;
  --c-amber: #ffd04d; --c-magenta: #ff7ad6; --c-red: #ff8272; --c-blue: #7ea6ff;
  --t-orange: rgba(255,140,94,.15); --t-cyan: rgba(82,225,255,.14); --t-green: rgba(94,242,160,.14);
  --t-violet: rgba(191,168,255,.15); --t-amber: rgba(255,208,77,.14); --t-magenta: rgba(255,122,214,.14); --t-red: rgba(255,130,114,.15);
  --hl: rgba(255,255,255,0); --on-ac: #0a0a0a;
  --sx: 0px; --sy: 0px; --ring-w: 1px; --glow-blur: 34px; --nglow: 7px; --edge-w: 3px;
  --hov-x: 0px; --hov-y: 0px; --hov-glow: 18px; --tglow: 18px; --gglow: 28px;
  --glass: rgba(9,9,9,.9);
  color-scheme: dark;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #090909; --bg2: #101010; --surface: #151515; --surface2: #1d1d1d; --code: #0c0c0c;
    --line: #2b2b2b; --outline: #3a3a3a; --dot: #1d1d1d;
    --fg: #f4f4f4; --fg2: #cbcbcb; --fg3: #9d9d9d;
    --c-orange: #ff8c5e; --c-cyan: #52e1ff; --c-green: #5ef2a0; --c-violet: #bfa8ff;
    --c-amber: #ffd04d; --c-magenta: #ff7ad6; --c-red: #ff8272; --c-blue: #7ea6ff;
    --t-orange: rgba(255,140,94,.15); --t-cyan: rgba(82,225,255,.14); --t-green: rgba(94,242,160,.14);
    --t-violet: rgba(191,168,255,.15); --t-amber: rgba(255,208,77,.14); --t-magenta: rgba(255,122,214,.14); --t-red: rgba(255,130,114,.15);
    --hl: rgba(255,255,255,0); --on-ac: #0a0a0a;
    --sx: 0px; --sy: 0px; --ring-w: 1px; --glow-blur: 34px; --nglow: 7px; --edge-w: 3px;
    --hov-x: 0px; --hov-y: 0px; --hov-glow: 18px; --tglow: 18px; --gglow: 28px;
    --glass: rgba(9,9,9,.9);
    color-scheme: dark;
  }
}
.hue-cyan    { --ac: var(--c-cyan);    --ac-t: var(--t-cyan); }
.hue-green   { --ac: var(--c-green);   --ac-t: var(--t-green); }
.hue-violet  { --ac: var(--c-violet);  --ac-t: var(--t-violet); }
.hue-amber   { --ac: var(--c-amber);   --ac-t: var(--t-amber); }
.hue-magenta { --ac: var(--c-magenta); --ac-t: var(--t-magenta); }
.hue-red     { --ac: var(--c-red);     --ac-t: var(--t-red); }
.hue-orange  { --ac: var(--c-orange);  --ac-t: var(--t-orange); }
:root {
  --f-body: "Manrope", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-head: "Bricolage Grotesque", "Manrope", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  --ac: var(--c-orange); --ac-t: var(--t-orange);
}
* { box-sizing: border-box; }
html { scroll-padding-top: calc(var(--hdr, 64px) + 18px); }
body {
  margin: 0; background: var(--bg); color: var(--fg); font: 400 15px/1.55 var(--f-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background-image: radial-gradient(var(--dot) 1px, transparent 1px); background-size: 22px 22px; -webkit-text-size-adjust: 100%;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 60; background: var(--bg); }
code, pre, kbd { font-family: var(--f-mono); }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--c-orange); outline-offset: 2px; border-radius: 4px; }
[hidden] { display: none !important; }
.wrap { max-width: 1480px; margin: 0 auto; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- header ---------- */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 50; background: var(--glass); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
  margin-left: calc(-1 * max(16px, env(safe-area-inset-left, 0px))); margin-right: calc(-1 * max(16px, env(safe-area-inset-right, 0px)));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.top-in { max-width: 1480px; margin: 0 auto; display: flex; align-items: center; gap: 12px; padding-block: 10px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; font: 800 19px/1 var(--f-head); letter-spacing: -.01em; margin-right: 6px; white-space: nowrap; cursor: pointer; background: none; border: 0; padding: 0; }
.brand svg { width: 30px; height: 30px; flex: none; }
.brand b { color: var(--c-orange); font-weight: 800; }
.search { flex: 1 1 220px; min-width: 0; position: relative; }
.search input { width: 100%; height: 42px; padding: 0 44px 0 40px; border-radius: 12px; border: 1.5px solid var(--outline); background: var(--surface); color: var(--fg); font: 500 14.5px var(--f-body); }
.search input::placeholder { color: var(--fg3); }
.search input:focus { outline: none; border-color: var(--c-orange); box-shadow: 0 0 0 3px var(--t-orange); }
.search .ico { position: absolute; left: 13px; top: 50%; translate: 0 -50%; color: var(--fg3); pointer-events: none; display: grid; }
.search kbd { position: absolute; right: 10px; top: 50%; translate: 0 -50%; font-size: 12px; color: var(--fg3); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 6px; padding: 1px 7px; background: var(--surface2); }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 42px; padding: 0 16px; border-radius: 12px; border: 1.5px solid var(--outline); background: var(--surface);
  font-weight: 700; font-size: 14px; white-space: nowrap; transition: transform .12s, box-shadow .12s, background .12s;
}
.btn:hover { box-shadow: var(--hov-x) var(--hov-y) 0 var(--outline), 0 0 var(--hov-glow) var(--c-orange); transform: translate(-1px, -1px); }
.btn:active { transform: none; }
.btn:disabled { opacity: .4; pointer-events: none; }
.btn.primary { background: var(--c-orange); color: var(--on-ac); }
.btn.icon { width: 42px; padding: 0; font-size: 18px; }
.btn.sm { height: 34px; padding: 0 12px; font-size: 13px; border-radius: 10px; }
.btn[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
.menu-btn { display: none; }

/* ---------- layout ---------- */
.layout { display: grid; grid-template-columns: 270px minmax(0, 1fr); gap: 28px; padding-block: 20px 90px; align-items: start; }
.side { position: sticky; top: calc(var(--hdr, 64px) + 14px + env(safe-area-inset-top, 0px)); max-height: calc(100vh - var(--hdr, 64px) - 34px); overflow: auto; padding: 0 6px 20px 0; }
.side h2 { font: 700 11.5px var(--f-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--fg3); margin: 18px 0 6px 10px; display: flex; align-items: center; gap: 8px; }
.side h2:first-child { margin-top: 0; }
.side a { display: flex; align-items: center; gap: 9px; padding: 6px 10px; border-radius: 10px; text-decoration: none; font-weight: 600; font-size: 13.5px; color: var(--fg2); border: 1.5px solid transparent; cursor: pointer; line-height: 1.3; }
.side a .n { margin-left: auto; font: 500 11px var(--f-mono); color: var(--fg3); }
.side a:hover { background: var(--surface); color: var(--fg); }
.side a.on { background: var(--surface); color: var(--fg); border-color: var(--ac); box-shadow: var(--hov-x) var(--hov-y) 0 var(--outline), 0 0 var(--hov-glow) var(--ac-t); }
.side a.dim { display: none; }
.side a .em { width: 1.3em; text-align: center; flex: none; }
.side .sp { height: 1.5px; background: var(--line); margin: 14px 10px; }
.scrim { display: none; }

/* ---------- hero (home) ---------- */
.hero { padding-block: 10px 6px; display: grid; gap: 16px; }
.hero h1 { margin: 0; font: 800 clamp(38px, 6.4vw, 72px)/.95 var(--f-head); letter-spacing: -.035em; text-wrap: balance; }
.hero h1 .g { color: var(--c-orange); text-shadow: 0 0 var(--gglow) rgba(255,140,94,.6); background: linear-gradient(transparent 60%, var(--hl) 60%); }
.hero p { margin: 0; max-width: 70ch; color: var(--fg2); font-size: 17px; }
.legend { display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; font-size: 13px; color: var(--fg2); }
.legend .it { display: inline-flex; align-items: center; gap: 7px; }
.legend svg { width: 34px; height: 22px; flex: none; overflow: visible; }
.grp { margin-top: 30px; }
.grp-h { display: flex; align-items: center; gap: 12px; font: 700 12px var(--f-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--ac); margin-bottom: 12px; }
.grp-h::after { content: ""; flex: 1; height: 1.5px; background: linear-gradient(90deg, var(--ac), transparent); opacity: .55; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(255px, 1fr)); gap: 14px; }
.card {
  text-align: left; display: grid; gap: 8px; align-content: start; padding: 14px 16px 15px; border-radius: 16px; border: 1.5px solid var(--outline); background: var(--surface);
  box-shadow: var(--sx) var(--sy) 0 var(--ac), 0 0 0 var(--ring-w) var(--ac-t); transition: transform .12s, box-shadow .12s; min-height: 126px;
}
.card:hover { transform: translate(-2px, -2px); box-shadow: calc(var(--sx) + 2px) calc(var(--sy) + 2px) 0 var(--ac), 0 0 var(--hov-glow) var(--ac); }
.card h3 { margin: 0; font: 800 17px/1.2 var(--f-head); letter-spacing: -.01em; display: flex; gap: 8px; align-items: baseline; }
.card p { margin: 0; color: var(--fg2); font-size: 13.5px; line-height: 1.45; }
.card .cmds { display: flex; flex-wrap: wrap; gap: 5px; }
.cmd-chip { font: 600 11.5px var(--f-mono); padding: 1px 8px; border-radius: 999px; background: var(--ac-t); border: 1px solid var(--ac); color: var(--fg); white-space: nowrap; }
.card .tag { font: 700 10px var(--f-mono); letter-spacing: .06em; text-transform: uppercase; padding: 1px 7px; border-radius: 6px; margin-left: auto; align-self: center; flex: none; }
.tag.danger { background: var(--t-red); color: var(--c-red); border: 1px solid var(--c-red); }
.tag.new { background: var(--t-green); color: var(--c-green); border: 1px solid var(--c-green); }

/* ---------- command page ---------- */
.crumb { display: flex; gap: 8px; align-items: center; font: 700 12px var(--f-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--ac); }
.crumb button { border: 0; background: none; color: var(--fg3); padding: 0; font: inherit; letter-spacing: .1em; text-transform: uppercase; }
.crumb button:hover { color: var(--fg); text-decoration: underline; }
.cmd-h { display: grid; gap: 10px; margin-bottom: 8px; }
.cmd-h h2 { margin: 0; font: 800 clamp(26px, 4vw, 42px)/1.1 var(--f-mono); letter-spacing: -.03em; overflow-wrap: anywhere; }
.cmd-h h2 span { background: linear-gradient(transparent 62%, var(--hl) 62%); text-shadow: 0 0 var(--tglow) var(--ac); }
.cmd-h p { margin: 0; color: var(--fg2); max-width: 78ch; font-size: 16px; }
code, .code { font-family: var(--f-mono); }
.cmd-h code, .notes code, .say code, .sit code, .vars code { background: var(--code); border: 1px solid var(--line); border-radius: 6px; padding: 0 5px; font-size: .88em; }
.notes { display: grid; gap: 8px; margin: 6px 0 4px; }
.note { border: 1.5px solid var(--line); border-left: 5px solid var(--ac); border-radius: 12px; background: var(--surface); padding: 8px 14px; font-size: 14.5px; color: var(--fg2); max-width: 86ch; }
.note.danger { border-left-color: var(--c-red); }
.note b { color: var(--fg); }
.vars { margin: 10px 0 0; border: 1.5px solid var(--line); border-radius: 14px; background: var(--surface); padding: 4px 6px; display: grid; }
.vars h3, .ex-h h3 { margin: 0; }
.vars summary { cursor: pointer; font: 700 12px var(--f-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--ac); padding: 8px 10px; }
.vars dl { margin: 0; padding: 0 10px 10px; display: grid; grid-template-columns: minmax(0, max-content) minmax(0, 1fr); gap: 6px 16px; font-size: 14px; }
.vars dt { font: 600 13px var(--f-mono); color: var(--fg); overflow-wrap: anywhere; } .vars dd { margin: 0; color: var(--fg2); }
.ex-title { display: flex; align-items: center; gap: 12px; font: 700 12px var(--f-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--ac); margin: 30px 0 12px; }
.ex-title::after { content: ""; flex: 1; height: 1.5px; background: linear-gradient(90deg, var(--ac), transparent); opacity: .55; }
.ex { margin: 0 0 30px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; }
.ex-h { display: grid; gap: 4px; }
.ex-h h3 { font: 800 21px/1.2 var(--f-head); letter-spacing: -.015em; display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.ex-h h3 .tag { font: 700 10px var(--f-mono); letter-spacing: .06em; text-transform: uppercase; padding: 1px 7px; border-radius: 6px; }
.sit { margin: 0; color: var(--fg2); font-size: 15px; max-width: 86ch; }
.stagebox {
  position: relative; border: 1.5px solid var(--outline); border-radius: 20px; background: var(--bg2); padding: 12px;
  box-shadow: var(--sx) var(--sy) 0 var(--ac), 0 0 0 var(--ring-w) var(--ac-t), 0 0 var(--glow-blur) var(--ac-t);
}
.stage-host { width: 100%; position: relative; }
.stage-host svg.stage { display: block; width: 100%; overflow: visible; font-family: var(--f-mono); -webkit-user-select: none; user-select: none; }
.controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.steps { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.dot { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--outline); background: var(--surface); padding: 0; transition: transform .12s, background .12s; }
.dot:hover { transform: scale(1.25); }
.dot.done { background: var(--ac); border-color: var(--ac); }
.dot.cur { background: var(--fg); border-color: var(--fg); transform: scale(1.35); box-shadow: 0 0 var(--hov-glow) var(--ac); }
.dot.danger { border-color: var(--c-red); }
.stepno { font: 700 12.5px var(--f-mono); color: var(--fg3); white-space: nowrap; margin-left: auto; }
.term-box { border: 1.5px solid var(--outline); border-radius: 14px; background: var(--code); overflow: hidden; }
.term-bar { display: flex; align-items: center; gap: 7px; padding: 7px 12px; border-bottom: 1px solid var(--line); background: var(--surface2); font: 600 12px var(--f-mono); color: var(--fg3); }
.term-bar i { width: 10px; height: 10px; border-radius: 50%; background: var(--line); display: inline-block; }
.term-bar i:nth-child(1) { background: var(--c-red); } .term-bar i:nth-child(2) { background: var(--c-amber); } .term-bar i:nth-child(3) { background: var(--c-green); }
.term-bar .t { margin-left: 6px; }
.term { font: 500 12.8px/1.5 var(--f-mono); padding: 10px 14px 12px; max-height: 330px; min-height: 64px; overflow: auto; white-space: pre-wrap; overflow-wrap: anywhere; color: var(--fg2); }
.term .ln { min-height: 1.5em; }
.term .cmdln { color: var(--fg); font-weight: 700; margin-top: 8px; }
.term .cmdln:first-child { margin-top: 0; }
.term .ps { color: var(--c-green); margin-right: 8px; user-select: none; }
.term .ps b { color: var(--c-cyan); font-weight: 700; }
.term .idle { color: var(--fg3); }
.s-err { color: var(--c-red); } .s-hint { color: var(--c-amber); } .s-dim { color: var(--fg3); } .s-add { color: var(--c-green); } .s-del { color: var(--c-red); }
.s-yel, .s-hash { color: var(--c-amber); } .s-cur { color: var(--c-cyan); font-weight: 800; } .s-brn { color: var(--c-green); font-weight: 800; } .s-rem { color: var(--c-red); font-weight: 700; }
.s-tag { color: var(--c-amber); font-weight: 800; } .s-dh { font-weight: 800; color: var(--fg); } .s-hunk { color: var(--c-cyan); } .s-bold { font-weight: 800; color: var(--fg); } .s-warn { color: var(--c-amber); }
.s-ed { color: var(--c-violet); } .s-cmd { color: var(--c-green); }
.s-g0 { color: var(--c-cyan); font-weight: 800; } .s-g1 { color: var(--c-orange); font-weight: 800; } .s-g2 { color: var(--c-green); font-weight: 800; }
.s-g3 { color: var(--c-violet); font-weight: 800; } .s-g4 { color: var(--c-amber); font-weight: 800; } .s-g5 { color: var(--c-magenta); font-weight: 800; }
.caret { display: inline-block; width: 8px; height: 1.1em; background: var(--c-orange); vertical-align: text-bottom; animation: blink 1.1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.say { border: 1.5px solid var(--outline); border-left: 6px solid var(--ac); border-radius: 14px; background: var(--surface); padding: 11px 16px; font-size: 15.5px; line-height: 1.55; min-height: 62px; }
.say p { margin: 0; } .say p + p { margin-top: 6px; }
.say .warn { color: var(--c-red); font-weight: 600; font-size: 14.5px; }
.say b { color: var(--fg); }
.next-prev { display: flex; flex-wrap: wrap; gap: 8px; justify-content: space-between; margin-top: 10px; }

/* ---------- SVG stage ---------- */
.L0 { --lc: var(--c-cyan); } .L1 { --lc: var(--c-orange); } .L2 { --lc: var(--c-green); } .L3 { --lc: var(--c-violet); } .L4 { --lc: var(--c-amber); } .L5 { --lc: var(--c-magenta); }
.T0 { --tc: var(--c-cyan); } .T1 { --tc: var(--c-orange); } .T2 { --tc: var(--c-green); } .T3 { --tc: var(--c-violet); } .T4 { --tc: var(--c-amber); } .T5 { --tc: var(--c-magenta); } .T6 { --tc: var(--c-red); } .T7 { --tc: var(--c-blue); }
.pbg { fill: var(--surface); stroke: var(--outline); stroke-width: 1.5; }
.panel.bare .pbg { fill: var(--surface2); }
.panel.ghost .pbg { stroke-dasharray: 6 6; stroke: var(--line); }
.ptitle { font: 800 15px var(--f-head); fill: var(--fg); letter-spacing: -.01em; }
.psub { font: 500 11.5px var(--f-body); fill: var(--fg3); }
.pbadge rect { fill: var(--t-amber); stroke: var(--c-amber); stroke-width: 1.2; }
.pbadge text { font: 800 10px var(--f-mono); fill: var(--c-amber); letter-spacing: .05em; }
.pbadge.info rect { fill: var(--t-violet); stroke: var(--c-violet); } .pbadge.info text { fill: var(--c-violet); }
.psep { stroke: var(--line); stroke-dasharray: 4 5; stroke-width: 1.5; }

/* ---------- global events ---------- */
function bindGlobal() {
  document.addEventListener('click', (e) => {
    const t = e.target; if (t.closest('#themeBtn')) { toggleTheme(); return; }
    const g = t.closest('[data-go]'); if (g) { e.preventDefault(); go(g.dataset.go); return; }
    if (t.closest('#brand')) { go('home'); return; } if (t.closest('#menuBtn')) { document.body.classList.toggle('nav-open'); return; } if (t.closest('#scrim')) document.body.classList.remove('nav-open');
  });
